rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # HostDown fires after 5 minutes of up==0 on the node job.
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="localhost"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostDown
        exp_alerts:
          - exp_labels:
              severity: warning
              category: service
              checklist_section: V.14
              job: node
              instance: localhost
            exp_annotations:
              summary: "Node exporter down on localhost"
              description: "node_exporter on localhost has not responded for 5+ minutes (stopped or crashed)"

  # 5% free is critical, and must NOT also trigger the warning band (10 to 20%).
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h", mountpoint="/", device="d", fstype="ext4"}'
        values: '5x20'
      - series: 'node_filesystem_size_bytes{instance="h", mountpoint="/", device="d", fstype="ext4"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: CriticalDiskSpace
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: I.2
              instance: h
              mountpoint: /
              device: d
              fstype: ext4
            exp_annotations:
              summary: "CRITICAL: Disk almost full on h"
              description: "/ (d) only has 5.0% free"
      - eval_time: 10m
        alertname: LowDiskSpace
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http", instance="http://x"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProbeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              category: network
              checklist_section: IV.12
              job: blackbox-http
              instance: "http://x"
            exp_annotations:
              summary: "Probe failing: http://x"
              description: "blackbox-http probe to http://x has failed for 5+ minutes"

  # Load of 2.0 on one core fires after 30 minutes.
  - interval: 1m
    input_series:
      - series: 'node_load5{instance="h"}'
        values: '2x40'
      - series: 'node_cpu_seconds_total{instance="h", cpu="0", mode="idle"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: HighCPULoad
        exp_alerts:
          - exp_labels:
              severity: warning
              category: os
              checklist_section: II.6
              instance: h
            exp_annotations:
              summary: "High CPU load on h"
              description: "5-min load average is 2.00 per core (threshold 1.5)"

  # A 78 degree NVMe is a warning, and is not caught by the CPU temperature rules.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="h", chip="c1", sensor="temp1"}'
        values: '78x15'
      - series: 'node_hwmon_chip_names{instance="h", chip="c1", chip_name="nvme"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: NVMeHighTemperature
        exp_alerts:
          - exp_labels:
              severity: warning
              category: hardware
              checklist_section: I.1
              instance: h
              chip: c1
              sensor: temp1
              chip_name: nvme
            exp_annotations:
              summary: "High NVMe temperature on h"
              description: "NVMe sensor temp1 is 78°C (warning above 75°C, critical above 85°C)"
      - eval_time: 12m
        alertname: HighCPUTemperature
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{instance="localhost:9090", job="prometheus"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              category: monitoring
              checklist_section: VII.21
              instance: "localhost:9090"
              job: prometheus
            exp_annotations:
              summary: "Prometheus failed to reload its configuration"
              description: "The running configuration is stale. Run promtool check config and read the journal for the reason."

  - interval: 1m
    input_series:
      - series: 'prometheus_notifications_alertmanagers_discovered{instance="localhost:9090", job="prometheus"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PrometheusNoAlertmanager
        exp_alerts:
          - exp_labels:
              severity: critical
              category: monitoring
              checklist_section: VII.22
              instance: "localhost:9090"
              job: prometheus
            exp_annotations:
              summary: "Prometheus has no Alertmanager"
              description: "Alerts are evaluated but cannot be delivered."

  - interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{instance="h", device="sda"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: SMARTStatusFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              category: hardware
              checklist_section: I.1
              instance: h
              device: sda
            exp_annotations:
              summary: "SMART self-assessment FAILED on h (sda)"
              description: "The drive reports a failing SMART status. Back up and replace it."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{instance="h", mountpoint="/data", device="d", fstype="ext4"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: I.2
              instance: h
              mountpoint: /data
              device: d
              fstype: ext4
            exp_annotations:
              summary: "Filesystem went read-only on h"
              description: "/data (d) is mounted read-only, usually after I/O errors. Check dmesg."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="h", mountpoint="/", device="d", fstype="ext4"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExpectedMountMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: I.2
              mountpoint: /data
            exp_annotations:
              summary: "Expected mount /data is missing"
              description: "node_filesystem_size_bytes has no series for /data: the mount is absent, unmounted or the host is not reporting."

  - interval: 1m
    input_series:
      - series: 'node_zfs_zpool_state{instance="h", zpool="tanks", state="degraded"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ZpoolNotOnline
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: III.8
              instance: h
              zpool: tanks
              state: degraded
            exp_annotations:
              summary: "ZFS pool tanks is degraded on h"
              description: "Run zpool status -x. A degraded pool has lost redundancy."

  # A ZFS member disk whose by-id path is gone fires after 1 minute, and only
  # for that disk (the present one stays quiet).
  - interval: 1m
    input_series:
      - series: 'zfs_expected_device_present{pool="tanks", device="scsi-aaa", instance="localhost"}'
        values: '1 1 1 0 0 0 0 0 0'
      - series: 'zfs_expected_device_present{pool="tanks", device="scsi-bbb", instance="localhost"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: ZpoolMemberMissing
        exp_alerts: []
      - eval_time: 3m30s
        alertname: ZpoolMemberMissing
        exp_alerts: []
      - eval_time: 6m
        alertname: ZpoolMemberMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: III.8
              pool: tanks
              device: scsi-aaa
              instance: localhost
            exp_annotations:
              summary: "ZFS member disk scsi-aaa is missing on localhost"
              description: "The by-id path is gone. ZFS may still report the pool ONLINE until I/O reaches the disk."

  # ZpoolMemberMissing resolves once the disk returns.
  - interval: 1m
    input_series:
      - series: 'zfs_expected_device_present{pool="tanks", device="scsi-aaa", instance="localhost"}'
        values: '1 0 0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: ZpoolMemberMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: III.8
              pool: tanks
              device: scsi-aaa
              instance: localhost
            exp_annotations:
              summary: "ZFS member disk scsi-aaa is missing on localhost"
              description: "The by-id path is gone. ZFS may still report the pool ONLINE until I/O reaches the disk."
      - eval_time: 7m
        alertname: ZpoolMemberMissing
        exp_alerts: []

  # An automatic re-online fires for an hour, and not for a disk that was never
  # onlined (timestamp 0). time() is seconds since the start of the test, so a
  # timestamp of 600 means "auto-onlined 10 minutes in".
  - interval: 1m
    input_series:
      - series: 'zfs_device_last_auto_online_timestamp_seconds{pool="tanks", device="scsi-aaa", instance="localhost"}'
        values: '600+0x130'
      - series: 'zfs_device_last_auto_online_timestamp_seconds{pool="tanks", device="scsi-bbb", instance="localhost"}'
        values: '0+0x130'
    alert_rule_test:
      - eval_time: 20m
        alertname: ZpoolMemberReonlined
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              checklist_section: III.8
              pool: tanks
              device: scsi-aaa
              instance: localhost
            exp_annotations:
              summary: "ZFS disk scsi-aaa was automatically re-onlined on localhost"
              description: "The disk disappeared and returned. Check for a loose cable/slot or a flaky drive: zpool status, SMART, journalctl -t zfs-member-reconcile."
      - eval_time: 100m
        alertname: ZpoolMemberReonlined
        exp_alerts: []

  # Non-zero checksum errors fire after 2 minutes; the zero read counter does not.
  - interval: 1m
    input_series:
      - series: 'zfs_vdev_errors{pool="tanks", device="scsi-aaa", vdev_type="disk", type="checksum", instance="localhost"}'
        values: '0 0 0 3 3 3 3 3 3'
      - series: 'zfs_vdev_errors{pool="tanks", device="scsi-aaa", vdev_type="disk", type="read", instance="localhost"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: ZpoolDeviceErrors
        exp_alerts: []
      - eval_time: 7m
        alertname: ZpoolDeviceErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              checklist_section: III.8
              pool: tanks
              device: scsi-aaa
              vdev_type: disk
              type: checksum
              instance: localhost
            exp_annotations:
              summary: "ZFS checksum errors on scsi-aaa (tanks) on localhost"
              description: "A vdev reports non-zero read/write/checksum errors while the pool may still be ONLINE. Investigate with zpool status -v and SMART, then zpool clear once resolved."

  # Permanent data errors are critical.
  - interval: 1m
    input_series:
      - series: 'zfs_pool_error_count{pool="tanks", instance="localhost"}'
        values: '0 0 2 2 2 2'
    alert_rule_test:
      - eval_time: 1m
        alertname: ZpoolDataErrors
        exp_alerts: []
      - eval_time: 5m
        alertname: ZpoolDataErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: III.8
              pool: tanks
              instance: localhost
            exp_annotations:
              summary: "ZFS pool tanks has permanent data errors on localhost"
              description: "Run zpool status -v to list affected files."

  # A scrub older than 10 days fires after 1 hour; a recent one does not. The
  # timestamps are negative so that time() - timestamp is already ~11 days (or
  # 1 hour) at the start of the test, without 16,000 samples of history.
  - interval: 1m
    input_series:
      - series: 'zfs_last_scrub_end_timestamp_seconds{pool="tanks", instance="localhost"}'
        values: '-950400+0x130'
      - series: 'zfs_last_scrub_end_timestamp_seconds{pool="fresh", instance="localhost"}'
        values: '-3600+0x130'
    alert_rule_test:
      - eval_time: 30m
        alertname: ZpoolScrubOverdue
        exp_alerts: []
      - eval_time: 90m
        alertname: ZpoolScrubOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              checklist_section: III.8
              pool: tanks
              instance: localhost
            exp_annotations:
              summary: "No completed scrub of tanks in over 10 days on localhost"
              description: "Weekly autoScrub is enabled; check zfs-scrub.service/timer and zpool status."

  # A scrub that finished with errors fires after 5 minutes; a clean pool does not.
  - interval: 1m
    input_series:
      - series: 'zfs_last_scrub_errors{pool="tanks", instance="localhost"}'
        values: '0 0 4 4 4 4 4 4 4 4'
      - series: 'zfs_last_scrub_errors{pool="clean", instance="localhost"}'
        values: '0x9'
    alert_rule_test:
      - eval_time: 5m
        alertname: ZpoolScrubErrors
        exp_alerts: []
      - eval_time: 9m
        alertname: ZpoolScrubErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              checklist_section: III.8
              pool: tanks
              instance: localhost
            exp_annotations:
              summary: "Last scrub of tanks finished with errors on localhost"
              description: "Run zpool status -v. This stays until the next clean scrub."

  - interval: 1m
    input_series:
      - series: 'node_power_supply_energy_full{instance="h", power_supply="BAT0"}'
        values: '50x90'
      - series: 'node_power_supply_energy_full_design{instance="h", power_supply="BAT0"}'
        values: '100x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: BatteryHealthDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              category: hardware
              checklist_section: I.1
              instance: h
              power_supply: BAT0
            exp_annotations:
              summary: "Battery wear on h"
              description: "BAT0 holds 50% of its design capacity"

