rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # HostDown fires after 5 minutes of up==0 on the node job.
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="localhost"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostDown
        exp_alerts:
          - exp_labels:
              severity: warning
              category: service
              checklist_section: V.14
              job: node
              instance: localhost
            exp_annotations:
              summary: "Host localhost is unreachable"
              description: "node_exporter on localhost has not responded for 5+ minutes (machine off, asleep or network down)"

  # 5% free is critical, and must NOT also trigger the warning band (10 to 20%).
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="h", mountpoint="/", device="d", fstype="ext4"}'
        values: '5x20'
      - series: 'node_filesystem_size_bytes{instance="h", mountpoint="/", device="d", fstype="ext4"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: CriticalDiskSpace
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              checklist_section: I.2
              instance: h
              mountpoint: /
              device: d
              fstype: ext4
            exp_annotations:
              summary: "CRITICAL: Disk almost full on h"
              description: "/ (d) only has 5.0% free"
      - eval_time: 10m
        alertname: LowDiskSpace
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http", instance="http://x"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProbeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              category: network
              checklist_section: IV.12
              job: blackbox-http
              instance: "http://x"
            exp_annotations:
              summary: "Probe failing: http://x"
              description: "blackbox-http probe to http://x has failed for 5+ minutes"

  # Load of 2.0 on one core fires after 30 minutes; the old 0.7/10m rule is gone.
  - interval: 1m
    input_series:
      - series: 'node_load5{instance="h"}'
        values: '2x40'
      - series: 'node_cpu_seconds_total{instance="h", cpu="0", mode="idle"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: HighCPULoad
        exp_alerts:
          - exp_labels:
              severity: warning
              category: os
              checklist_section: II.6
              instance: h
            exp_annotations:
              summary: "High CPU load on h"
              description: "5-min load average is 2.00 per core (threshold 1.5)"

  # A 78 degree NVMe is a warning, and is not caught by the CPU temperature rules.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="h", chip="c1", sensor="temp1"}'
        values: '78x15'
      - series: 'node_hwmon_chip_names{instance="h", chip="c1", chip_name="nvme"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: NVMeHighTemperature
        exp_alerts:
          - exp_labels:
              severity: warning
              category: hardware
              checklist_section: I.1
              instance: h
              chip: c1
              sensor: temp1
              chip_name: nvme
            exp_annotations:
              summary: "High NVMe temperature on h"
              description: "NVMe sensor temp1 is 78°C (warning above 75°C, critical above 85°C)"
      - eval_time: 12m
        alertname: HighCPUTemperature
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{instance="localhost:9090", job="prometheus"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              category: monitoring
              checklist_section: VII.21
              instance: "localhost:9090"
              job: prometheus
            exp_annotations:
              summary: "Prometheus failed to reload its configuration"
              description: "The running configuration is stale. Run promtool check config and read the journal for the reason."

  - interval: 1m
    input_series:
      - series: 'prometheus_notifications_alertmanagers_discovered{instance="localhost:9090", job="prometheus"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PrometheusNoAlertmanager
        exp_alerts:
          - exp_labels:
              severity: critical
              category: monitoring
              checklist_section: VII.22
              instance: "localhost:9090"
              job: prometheus
            exp_annotations:
              summary: "Prometheus has no Alertmanager"
              description: "Alerts are evaluated but cannot be delivered."
